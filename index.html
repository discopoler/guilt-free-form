<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>UPLOAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    min-height: 100vh;
    background-image: url("http://www.fun-lover.com/graphic-shop/Tiles/images/Sky/sky-bk-007.jpg");
    background-repeat: repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Times New Roman', Times, serif;
}

.header-img {
    width: 100%;
    max-width: 600px;
    margin-top: 10px;
}

.box {
    background: rgba(255,255,255,0.9);

  
    width: 90%;
    max-width: 400px;
    margin-top: 20px;
    text-align: center;
}

textarea {
    
    width: 100%;
    height: 140px;
    font-size: 16px;
    
    
 
}

button {

    width: 100%;
    font-size: 20px;
    padding: 12px;
    cursor: pointer;
    border-radius: 8px;
    background-color: #667eea;
    color: white;
    
}

}
</style>
</head>

<body>




<div class="box">
    <textarea id="message" placeholder="CHATBOX: >PASTE YOUR LINK HERE< " required></textarea>
    <button onclick="sendMessage()">SEND MESSAGE!</button>
</div>

<script>
function sendMessage() {
    const text = document.getElementById("message").value.trim();
    if (!text) {
        alert("ERROR");
        return;
    }

    fetch("https://script.google.com/macros/s/AKfycbwZjB305oEQ4XL6anY_QgaftrmOq-4Iyb9mwVJHf5hMzCK8evkkZ03_YYnnsvbSSV8QRw/exec", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "text=" + encodeURIComponent(text)
    })
    .then(() => {
        window.location.href = "thanks.html";
    })
    .catch(err => {
        alert("Błąd wysyłania: " + err);
    });
}
</script>

</body>
</html>
